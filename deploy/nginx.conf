# /etc/nginx/sites-available/shop  — then: ln -s ../sites-available/shop /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d api.yourstore.com -d admin.yourstore.com

# API (used by the Android app)
server {
    listen 80;
    server_name api.yourstore.com;
    client_max_body_size 20m;

    location /uploads/ {
        alias /var/www/shop/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin panel (static build) — calls the API on the same origin via /api
server {
    listen 80;
    server_name admin.yourstore.com;
    client_max_body_size 20m;
    root /var/www/shop/admin/dist;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /uploads/ { alias /var/www/shop/backend/uploads/; expires 30d; }
    location / { try_files $uri /index.html; }
}
