name: Android APK

# Builds the debug APK on every push that touches the app, and publishes it as a
# GitHub Release ("android-latest") so it can be downloaded straight onto a phone.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          # Surface Kotlin/Gradle errors as annotations (visible on the run page and via the API)
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Publish APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kutuku-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest kutuku-debug.apk \
            --title "Android app (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. Install on an Android phone: download kutuku-debug.apk, open it, and allow installing from this source. Talks to https://kutuku-seven.vercel.app (demo OTP 123456)." \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Render every screen (375x812 dp, like the Figma frames) and publish them for design review
      - name: Render screen screenshots
        id: screens
        if: success()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --tests "*ScreenshotTest*" -Proborazzi.test.record=true --no-daemon 2>&1 | tee screens.log
          cd app/build/outputs/roborazzi && zip -q -r "$GITHUB_WORKSPACE/android/screens.zip" .
          cd "$GITHUB_WORKSPACE/android"
          gh release delete screens-latest --yes --cleanup-tag || true
          gh release create screens-latest screens.zip --title "Screen renders (latest)" --notes "Rendered screens for commit ${GITHUB_SHA::7}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report screenshot errors
        if: always() && steps.screens.outcome == 'failure'
        run: grep -E '^e: |FAILED|Exception' -A3 screens.log 2>/dev/null | head -40 | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done || true
